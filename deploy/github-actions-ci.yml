name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: Install pinned dependencies
        run: bash scripts/setup.sh
      - name: Test isolated synthetic workflows
        run: bash scripts/check.sh
      - name: Exercise real HTTP and document worker
        run: .venv/bin/python scripts/smoke.py
